name: instill

services:
  instill:
    image: ${INSTILL_IMAGE:-${CLEARPORT_IMAGE:-ghcr.io/robothanzo/tencenthackathon2026:main}}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:${INSTILL_PORT:-${CLEARPORT_PORT:-3001}}:3001'
    environment:
      NODE_ENV: production
      DEMO_MODE: ${DEMO_MODE:-false}
      HOST: 0.0.0.0
      PORT: '3001'
      ACCESS_LOG: ${ACCESS_LOG:-true}
      DATA_PATH: /app/data/instill.db
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:-}
      APP_USER_ID: ${APP_USER_ID:-manager-sarah}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      ADP_APP_KEY: ${ADP_APP_KEY:-}
      ADP_ENDPOINT: ${ADP_ENDPOINT:-https://wss.lke.tencentcloud.com/adp/v2/chat}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      AI_CALLS_PER_HOUR: ${AI_CALLS_PER_HOUR:-120}
      ADP_KNOWLEDGE_SYNC: ${ADP_KNOWLEDGE_SYNC:-false}
      ADP_APP_BIZ_ID: ${ADP_APP_BIZ_ID:-}
      ADP_AUTO_PUBLISH: ${ADP_AUTO_PUBLISH:-false}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      TENCENT_TOKEN: ${TENCENT_TOKEN:-}
      TENCENT_REGION: ${TENCENT_REGION:-ap-jakarta}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-ap-singapore}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - instill_data:/app/data
    # Access logs print to `docker compose logs instill`; rotate so they cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  instill_data:
