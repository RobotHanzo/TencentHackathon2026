# Legacy HTTPS filename, retained for existing installations.
# New deployments use compose.https.yaml; use only one HTTPS overlay at a time.
# This file does not provision Tencent resources or enable Tencent APIs.
services:
  instill:
    environment:
      APP_COOKIE_SECURE: 'true'

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      instill:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      CLEARPORT_DOMAIN: ${CLEARPORT_DOMAIN:?Set CLEARPORT_DOMAIN to your DNS hostname}
      CLEARPORT_TLS_EMAIL: ${CLEARPORT_TLS_EMAIL:?Set CLEARPORT_TLS_EMAIL for certificate notices}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
